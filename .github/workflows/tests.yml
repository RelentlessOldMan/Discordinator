# Run every test suite on each push and pull request, on Windows (where the
# sessions actually run) and Linux. The suites are standalone scripts: each
# exits non-zero on its first failed check. They use temp configs and the local
# transport or a mock server, so no token or network is needed.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[tui]"

      - name: Run all suites
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          failed=()
          for t in tests/test_*.py; do
            echo "::group::$t"
            if python "$t"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$t::$t failed"
              failed+=("$t")
            fi
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed suites: ${failed[*]}"
            exit 1
          fi
          echo "All $(ls tests/test_*.py | wc -l) suites passed."
