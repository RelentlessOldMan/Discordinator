[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discordinator"
dynamic = ["version"]
description = "CLI + MCP server to send/read Discord channel messages — relay info between Claude sessions."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Discordinator" }]
dependencies = [
    "httpx>=0.27",
    "mcp>=2",
    "truststore>=0.9",
]

[project.optional-dependencies]
# Full-screen terminal viewer for local mode: `discordinator tui`.
# Install with:  pip install -e .[tui]
tui = ["textual>=0.60"]

[project.scripts]
discordinator = "discordinator.cli:main"
discordinator-mcp = "discordinator.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "discordinator.__version__" }
